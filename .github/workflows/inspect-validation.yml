name: Inspect native validation report
on:
  pull_request:
    paths: ['.github/workflows/inspect-validation.yml']
  workflow_dispatch:
    inputs:
      artifact_id:
        description: Repository artifact containing synthetic native smoke reports
        required: true
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read checksummed report archive
        env:
          GH_TOKEN: ${{ github.token }}
          ATLAS_ARTIFACT_ID: ${{ inputs.artifact_id }}
          ATLAS_REPOSITORY: ${{ github.repository }}
          ATLAS_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, subprocess, json, hashlib, zipfile, io, re, sys, traceback
          def report_error(kind, value, tb):
              message = ''.join(traceback.format_exception_only(kind, value)).strip()
              message = re.sub(r'https?://[^\s]+', '[URL redacted]', message)
              message = message.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print(f'::error title=Report inspection failure::{message}', flush=True)
          sys.excepthook = report_error
          artifact = os.environ['ATLAS_ARTIFACT_ID']
          if not artifact:
              listing = json.loads(subprocess.check_output(['gh', 'api', f"repos/{os.environ['ATLAS_REPOSITORY']}/actions/artifacts?name=atlas-x86_64-pc-windows-msvc&per_page=10"]))
              artifact = str(next(a['id'] for a in listing['artifacts'] if not a['expired'] and a['workflow_run']['head_branch'] == os.environ['ATLAS_BRANCH']))
          print(f'::notice title=Report archive::Inspecting repository artifact {artifact}')
          if not re.fullmatch(r'[0-9]+', artifact):
              raise SystemExit('Artifact ID must be numeric')
          endpoint = f"repos/{os.environ['ATLAS_REPOSITORY']}/actions/artifacts/{artifact}"
          metadata = json.loads(subprocess.check_output(['gh', 'api', endpoint]))
          archive = subprocess.check_output(['gh', 'api', endpoint + '/zip'])
          if 'sha256:' + hashlib.sha256(archive).hexdigest() != metadata['digest']:
              raise SystemExit('Archive checksum mismatch')
          jobs = json.loads(subprocess.check_output(['gh', 'api', f"repos/{os.environ['ATLAS_REPOSITORY']}/actions/runs/{metadata['workflow_run']['id']}/jobs"]))
          job = next(j for j in jobs['jobs'] if 'windows' in j['name'].lower())
          result = subprocess.run(['gh', 'api', f"repos/{os.environ['ATLAS_REPOSITORY']}/actions/runs/{metadata['workflow_run']['id']}/logs"], stdout=subprocess.PIPE, stderr=subprocess.PIPE)
          if result.returncode == 0:
              with zipfile.ZipFile(io.BytesIO(result.stdout)) as logs_zip:
                  logs = '\n'.join(logs_zip.read(n).decode('utf8', errors='replace') for n in logs_zip.namelist() if 'windows' in n.lower())
          else:
              logs = result.stderr.decode('utf8', errors='replace')
          logs = re.sub(r'https?://[^\s]+', '[URL redacted]', logs)
          lines = re.sub(r'\x1b\[[0-9;]*m', '', logs).splitlines()
          selected = set()
          for i, line in enumerate(lines):
              if re.search(r'error|exception|lock file|failed', line, re.I):
                  selected.update(range(max(0,i-2), min(len(lines),i+8)))
          diagnostic = '\n'.join(lines[i] for i in sorted(selected))[-14000:]
          diagnostic = re.sub(r'[A-Za-z0-9+/=]{80,}', '[long token redacted]', diagnostic)
          diagnostic = diagnostic.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::notice title=Native failure diagnostics::{diagnostic}')
          with zipfile.ZipFile(io.BytesIO(archive)) as z:
              for entry in z.infolist():
                  if entry.filename.endswith(('windows-installation-smoke.json', 'controlled-update-smoke.json')):
                      if entry.file_size > 65536:
                          raise SystemExit('Unexpected report size')
                      report = json.loads(z.read(entry))
                      message = json.dumps(report, separators=(',', ':'))
                      message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print(f'::notice title={entry.filename}::{message}')
          PY
